# Citus worker shards on CloudNativePG v1.30.0 (E07.1-T03, Profile B).
# Two worker Cluster CRs (1 primary + 1 standby each) with automated backup,
# plus a registration Job that enables citus on every tier and adds both
# workers to the coordinator (review: post-init worker registration script).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: citus-worker1
  namespace: database
  labels:
    app.kubernetes.io/part-of: go-template
    app.kubernetes.io/component: citus-worker
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-citus14

  postgresql:
    parameters:
      shared_preload_libraries: "citus"
      citus.shard_count: "32"
      citus.shard_replication_factor: "1"
      max_connections: "200"
      synchronous_commit: "on"
      synchronous_standby_names: "ANY 1 (*)"

  bootstrap:
    initdb:
      database: ledger
      owner: ledger
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS citus;

  storageConfiguration:
    size: 100Gi
    storageClass: fast-ssd

  backup:
    barmanObjectStore:
      destinationPath: s3://ledger-backups/citus-worker1
      endpointURL: https://minio.database.svc:9000
      s3Credentials:
        accessKeyId:
          name: cluster-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cluster-backup-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "30d"

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: citus-worker2
  namespace: database
  labels:
    app.kubernetes.io/part-of: go-template

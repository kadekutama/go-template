# air hot-reload configuration (E00-T04, tracked base).
# Personal overrides belong in .air.toml.local (gitignored by E00-T01).

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Rebuild the REST API binary on change; 500ms debounce.
  cmd = "go build -o ./tmp/rest-api ./cmd/rest-api"
  bin = "./tmp/rest-api"
  full_bin = ""
  delay = 500
  stop_on_error = true
  send_interrupt = false
  kill_delay = "0s"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["bin", "vendor", "test", "docs", "tmp", "assets", "node_modules", ".git"]
  include_dir = []
  # Extra watched inputs beyond Go sources (E00-T04-R01: config/*.yaml).
  include_file = ["config/.*\\.yaml"]
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = false
  follow_symlink = false
  log = "build-errors.log"

[build.args_bin]
[build.env_bin]

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

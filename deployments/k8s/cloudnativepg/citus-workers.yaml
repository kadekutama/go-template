---
# Post-init worker registration: waits for the coordinator and both worker
# primaries, enables citus everywhere, registers the workers, and prints
# pg_dist_node for the deploy log. Superuser credentials come from the
# CNPG-generated citus-coordinator-superuser Secret (never plaintext here).
apiVersion: batch/v1
kind: Job
metadata:
  name: citus-register-workers
  namespace: database
  labels:
    app.kubernetes.io/part-of: go-template
    app.kubernetes.io/component: citus-wiring
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: go-template
        app.kubernetes.io/component: citus-wiring
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: ghcr.io/cloudnative-pg/postgresql:18.6-citus14
          env:
            - name: PGHOST
              value: citus-coordinator-rw.database.svc
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: citus-coordinator-superuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: citus-coordinator-superuser
                  key: password
            - name: PGDATABASE
              value: ledger
          command:
            - sh
            - -ec
            - |
              for host in citus-coordinator-rw.database.svc citus-worker1-rw.database.svc citus-worker2-rw.database.svc; do
                echo "waiting for $host..."
                for i in $(seq 1 90); do
                  pg_isready -h "$host" && break
                  sleep 10
                done
              done
              for host in citus-coordinator-rw.database.svc citus-worker1-rw.database.svc citus-worker2-rw.database.svc; do
                psql -h "$host" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS citus;"
              done
              psql -v ON_ERROR_STOP=1 <<'SQL'
              SELECT citus_add_node('citus-worker1-rw.database.svc', 5432);
              SELECT citus_add_node('citus-worker2-rw.database.svc', 5432);
              SQL
              psql -v ON_ERROR_STOP=1 -c "SELECT nodename, nodeport, isactive FROM pg_dist_node ORDER BY nodename;"
---
# Worker access boundary: coordinator, sibling workers, and application pods.
# Selectors use cnpg.io/cluster (set by the operator on every pod; custom
# Cluster labels are NOT auto-propagated to pods without spec.inheritedMetadata).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: citus-workers-allow
  namespace: database
  labels:
    app.kubernetes.io/part-of: go-template
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: In
        values: [citus-worker1, citus-worker2]
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 5432
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: citus-coordinator
        - podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: In
                values: [citus-worker1, citus-worker2]
        - namespaceSelector:
            matchLabels:
              name: app
---
# Registration job egress: needs the coordinator and worker read-write endpoints.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: citus-register-allow
  namespace: database
  labels:
    app.kubernetes.io/part-of: go-template
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: citus-wiring
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 5432
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: citus-coordinator
        - podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: In
                values: [citus-worker1, citus-worker2]

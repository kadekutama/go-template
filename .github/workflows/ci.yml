# Minimal CI gate: lint + build on every PR (E00-T05).
#
# NOTE (E17): the full pipeline matrix (integration, contract, security, SBOM,
# staging deploy) EXTENDS this file. Do NOT create a second workflow file.

name: ci

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint+build gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Full history is required: scripts/build/version.sh derives the
          # release version from tags + commit count (E00-T07-R05). A shallow
          # clone would stamp binaries with a meaningless count of 1.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      # Pinned per SPEC §2 reproducibility; setup-go puts ~/go/bin on PATH.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      # gofmt ships with the Go toolchain (no install needed).
      # goimports and gopls are used by `make lint` (fmt-check + gopls-check)
      # but are not bundled with the toolchain, so they must be pinned here.
      # TODO(SPEC §2): pin exact versions once SPEC.md defines them (currently
      # setup.sh uses @latest; keep both in sync when versions are locked).
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Install gopls
        run: go install golang.org/x/tools/gopls@latest

      - name: Verify modules
        run: go mod verify

      - name: Check module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Lint
        run: make lint

      - name: Run race-detector test suite
        run: go test -race -count=1 ./...

      - name: Validate task metadata (SDD control plane, E00-T08)
        run: python3 tasks/scripts/check-tasks.py --format --graph --sdd

      - name: Resolve release version
        run: |
          VERSION="$(./scripts/build/version.sh)"
          if [[ "$VERSION" == "dev" ]]; then
            echo "version resolution fell back to dev with full history present" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "### Release version \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build all binaries
        run: make build-all

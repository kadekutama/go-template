# Citus coordinator on CloudNativePG v1.30.0 (E07.1-T03, Profile B).
# imageName is purpose-built from the cloudnative-pg base plus Citus 14.0
# (build recipe lands in the E17 image pipeline); the Citus extension is
# declared in bootstrap postInitSQL so review can verify it statically.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: citus-coordinator
  namespace: database
  labels:
    app.kubernetes.io/part-of: go-template
    app.kubernetes.io/component: citus-coordinator
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-citus14

  postgresql:
    parameters:
      shared_preload_libraries: "citus"
      citus.shard_count: "32"
      citus.shard_replication_factor: "1"
      max_connections: "200"
      synchronous_commit: "on"
      synchronous_standby_names: "ANY 1 (*)"

  bootstrap:
    initdb:
      database: ledger
      owner: ledger
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS citus;

  storageConfiguration:
    size: 50Gi
    storageClass: fast-ssd

  backup:
    barmanObjectStore:
      destinationPath: s3://ledger-backups/citus-coordinator
      endpointURL: https://minio.database.svc:9000
      s3Credentials:
        accessKeyId:
          name: cluster-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cluster-backup-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "30d"

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
---
# Coordinator access boundary: application pods plus intra-cluster peers only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: citus-coordinator-allow
  namespace: database
  labels:
    app.kubernetes.io/part-of: go-template
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: citus-coordinator
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 5432
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              name: app
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: go-template
        - podSelector:
            matchLabels:
              cnpg.io/cluster: citus-coordinator

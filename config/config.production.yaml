# Production overrides (no secret values — references only).
app:
  name: go-template
  env: production
server:
  host: 0.0.0.0
  port: 8080
database:
  host: postgres.production.svc
  port: 5432
  user: app_production
  password: "{{ secret:db/production/password }}"
  name: app
  sslmode: verify-full
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_sec: 1800
cache:
  host: valkey.production.svc
  port: 6379
auth:
  issuer: https://auth.example.com
  access_ttl_min: 15
  refresh_ttl_days: 7
nats:
  url: nats://nats.production.svc:4222
observability:
  log_level: warn
  otlp_endpoint: https://tempo.production.svc:4317
  sample_ratio: 0.1
feature_flags:
  unleash_url: https://unleash.production.svc:4242
secrets:
  provider: openbao
coordination:
  etcd_endpoints:
    - http://etcd.production.svc:2379
  etcd_dial_timeout_sec: 5
  etcd_election_ttl_sec: 5
  leader_key_prefix: "/finance/worker-leader"


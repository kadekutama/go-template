# Mockery v3 configuration (upgraded v2.53.7 → v3.8.0, 2026-10-07; see tasks/plans/SWEEP-modernize-exception.md).
# Regenerate with `make generate-mocks` (requires mockery v3, see scripts/dev/setup.sh).
# Mocks cover the domain repository ports and the application ports so every
# E06 handler and E07–E10 adapter builds against compiling fakes.

template: testify
template-data:
  unroll-variadic: true
packages:
  github.com/kadekutama/go-template/internal/application/command:
    config:
      all: true
      filename: "{{.InterfaceName}}.go"
      dir: test/mock/command
      pkgname: mockcommand
  github.com/kadekutama/go-template/internal/application/port:
    config:
      all: true
      filename: "{{.InterfaceName}}.go"
      dir: test/mock/application
      pkgname: mockapplication
  github.com/kadekutama/go-template/internal/application/service:
